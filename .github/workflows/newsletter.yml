name: Daily Newsletter

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: githubNewsletter

    # Same variable names as githubNewsletter/newsletter.py and newsletter_bot/.env
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_MODEL: gemini-2.5-flash-lite
      REQUEST_TIMEOUT_SECONDS: "20"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: githubNewsletter/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter
        run: python newsletter.py

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsletter-logs-${{ github.run_id }}
          path: githubNewsletter/logs/
